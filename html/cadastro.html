<section class="container my-4">
    <h1 class="mb-4 text-primary">Cadastre-se como Voluntário</h1>
    <p class="lead">Preencha o formulário para fazer parte do projeto Conecta Idade.</p>

    <form class="mx-auto bg-white p-4 rounded shadow-sm" style="max-width: 500px;">
        <div class="mb-3 text-start">
            <label class="form-label font-weight-bold">Nome Completo</label>
            <input type="text" class="form-control" placeholder="Digite o seu nome">
        </div>
        <div class="mb-3 text-start">
            <label class="form-label font-weight-bold">E-mail</label>
            <input type="email" class="form-control" placeholder="nome@exemplo.com">
        </div>
        <button type="button" class="btn btn-warning w-100 fw-bold text-white mt-3">Enviar Cadastro</button>
    </form>
</section>
